<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HotelAI Receptionist</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat {
      width: 420px;
      height: 650px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #1f2937;
      color: white;
      padding: 18px;
    }

    .header h2 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.8;
    }

    .messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      background: #f9fafb;
    }

    .msg {
      max-width: 80%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.4;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    button {
      margin-left: 8px;
      padding: 12px 16px;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <div class="chat">
    <div class="header">
      <h2>HotelAI Receptionist</h2>
      <p>AI Receptionist · Online 24/7</p>
    </div>

    <div class="messages" id="messages">
      <div class="msg bot">Hello! I am your AI receptionist. How can I help you today?</div>
    </div>

    <div class="input-area">
      <input id="question" placeholder="Ask about check-in, breakfast, parking..." onkeydown="handleEnter(event)">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const webhookUrl = "https://n8n.aihotelreceptionist.com/webhook/hotelai";

    function addMessage(text, sender) {
      const messages = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.innerText = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById("question");
      const question = input.value.trim();

      if (!question) return;

      addMessage(question, "user");
      input.value = "";

      const thinking = addMessage("Typing...", "bot");

      try {
        const response = await fetch(webhookUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });

        const answer = await response.text();
        thinking.innerText = answer || "Sorry, I could not get a response.";
      } catch (error) {
        thinking.innerText = "Connection error. Please try again.";
      }
    }
  </script>
</body>
</html>
